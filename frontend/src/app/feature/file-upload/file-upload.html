<mat-card class="file-upload-card">
  <mat-card-header>
    <mat-card-title>File Upload</mat-card-title>
    <mat-card-subtitle>Select files to upload</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="upload-area">
      <input
        type="file"
        #fileInput
        (change)="onFileSelected($event)"
        multiple
        hidden
      />
      <button mat-flat-button color="primary" (click)="fileInput.click()">
        <mat-icon>cloud_upload</mat-icon>
        Choose Files
      </button>
    </div>

    @if (files.length > 0) {
      <mat-list>
        <div mat-subheader>Selected Files</div>
        @for (file of files; track file.name; let i = $index) {
          <mat-list-item>
            <mat-icon matListItemIcon>insert_drive_file</mat-icon>
            <div matListItemTitle>{{ file.name }}</div>
            <div matListItemLine>{{ (file.size / 1024).toFixed(2) }} KB</div>
            <button mat-icon-button matListItemMeta (click)="removeFile(i)">
              <mat-icon>close</mat-icon>
            </button>
          </mat-list-item>
        }
      </mat-list>
    }
  </mat-card-content>
</mat-card>
