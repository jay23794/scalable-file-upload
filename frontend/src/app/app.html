<mat-sidenav-container class="app-container">
  <mat-sidenav
    #sidenav
    class="app-sidenav"
    mode="side"
    [opened]="sidenavOpen()"
  >
    <mat-toolbar color="primary" class="sidenav-header">
      <mat-icon>dashboard</mat-icon>
    </mat-toolbar>

    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/file-upload"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>cloud_upload</mat-icon>
        <span matListItemTitle>File Upload</span>
      </a>

      <a
        mat-list-item
        routerLink="/query-process"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>chat</mat-icon>
        <span matListItemTitle>Real-time Chat</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>
    </mat-toolbar>

    <main class="app-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
