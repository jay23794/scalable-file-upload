<mat-sidenav-container class="app-container">
  <mat-sidenav
    #sidenav
    class="app-sidenav"
    mode="side"
    [opened]="sidenavOpen()"
  >
    <div class="rail-brand">
      <mat-icon>dashboard</mat-icon>
    </div>

    <!-- An icon rail rather than a labelled list: the chat page already owns a
         sidebar of its own, and two columns of text read as one confused nav.
         Names move into tooltips, which is also why each link needs its own
         aria-label — an icon alone is nothing to a screen reader. -->
    <nav class="rail">
      <a
        class="rail-item"
        routerLink="/file-upload"
        routerLinkActive="active-link"
        matTooltip="File Upload"
        matTooltipPosition="right"
        aria-label="File Upload"
      >
        <mat-icon>cloud_upload</mat-icon>
      </a>

      <a
        class="rail-item"
        routerLink="/query-process"
        routerLinkActive="active-link"
        matTooltip="Real-time Chat"
        matTooltipPosition="right"
        aria-label="Real-time Chat"
      >
        <mat-icon>chat</mat-icon>
      </a>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="toolbar-spacer"></span>

      <button
        mat-icon-button
        [matMenuTriggerFor]="themeMenu"
        matTooltip="Appearance"
        aria-label="Appearance"
      >
        <mat-icon>{{ themeIcon() }}</mat-icon>
      </button>

      <mat-menu #themeMenu="matMenu">
        @for (option of themeOptions; track option.value) {
          <button type="button" mat-menu-item (click)="setTheme(option.value)">
            <mat-icon>{{ option.icon }}</mat-icon>
            <span>{{ option.label }}</span>
            @if (themePreference() === option.value) {
              <mat-icon class="theme-check">check</mat-icon>
            }
          </button>
        }
      </mat-menu>
    </mat-toolbar>

    <main class="app-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
