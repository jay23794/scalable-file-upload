<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MyFeature</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!--
      Applies the saved theme before first paint. ThemeService sets the same
      attribute, but only once Angular has bootstrapped — by then a dark-mode
      user has already been shown a white screen. This has to stay inline and
      synchronous in <head>; an external or deferred script is too late.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ocean-theme-preference');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* Blocked storage — fall through to following the OS. */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
