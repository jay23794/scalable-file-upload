services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongo:27017/feature
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  cloud-function-api:
    build:
      context: ./cloud-function
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - BACKEND_BASE_URL=http://backend:3000
    depends_on:
      redis:
        condition: service_healthy

  cloud-function-worker:
    build:
      context: ./cloud-function
    command: ["node", "dist/worker.js"]
    environment:
      - REDIS_URL=redis://redis:6379
      - BACKEND_BASE_URL=http://backend:3000
      - ML_SERVICE_URL=http://ml:5000
      - WORKER_CONCURRENCY=5
    depends_on:
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy

  ml:
    build:
      context: ./ml
    env_file:
      - ./ml/.env
    ports:
      - "5100:5000"
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/healthz').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  mongo-data:
